<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Concurso R. F. 2026</title>
  <meta name="theme-color" content="#D6217F">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       CONCURSO R. F. 2026
       Paleta: salmón rosa fucsia violeta pastel claro
       ============================================================ */
    :root {
      --salmon: #FF8A73;
      --salmon-claro: #FFD9CF;
      --fucsia: #D6217F;
      --violeta: #7B2FBE;
      --violeta-claro: #E8D5F5;
      --pastel: #FDF6F0;
      --gris: #F5F3F0;
      --texto: #1E1E2A;
      --sombra: 0 8px 30px rgba(214, 33, 127, 0.15);
      --radio: 20px;
      --fuente: 'Karla', sans-serif;
      --fuente-titulo: 'Fraunces', serif;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: var(--fuente);
      background: var(--pastel);
      color: var(--texto);
      min-height: 100vh;
      padding: 16px 12px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .app {
      max-width: 480px;
      width: 100%;
      background: white;
      border-radius: var(--radio);
      box-shadow: var(--sombra);
      padding: 20px 18px 28px;
      position: relative;
      overflow: hidden;
    }
    .app::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--salmon), var(--fucsia), var(--violeta));
    }
    h1 {
      font-family: var(--fuente-titulo);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--fucsia);
      margin-top: 8px;
      margin-bottom: 2px;
      letter-spacing: -0.5px;
    }
    .subtitulo {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 18px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .subtitulo span {
      color: var(--violeta);
      font-weight: 600;
    }

    /* ===== SOLAPA DE MESES (NUEVO) ===== */
    .meses-solapa {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 18px;
      justify-content: center;
      background: var(--gris);
      padding: 8px 10px;
      border-radius: 14px;
    }
    .mes-btn {
      background: transparent;
      border: none;
      padding: 6px 12px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 600;
      color: #888;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--fuente);
      letter-spacing: 0.3px;
      text-transform: uppercase;
      flex: 1 0 auto;
      min-width: 44px;
      text-align: center;
    }
    .mes-btn:hover {
      background: var(--salmon-claro);
      color: var(--texto);
    }
    .mes-btn.activo {
      background: var(--fucsia);
      color: white;
      box-shadow: 0 4px 12px rgba(214, 33, 127, 0.3);
    }
    .mes-btn.activo:hover {
      background: var(--violeta);
    }

    /* ===== RESTO DE LA INTERFAZ (SIN CAMBIOS) ===== */
    .seccion {
      background: var(--gris);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .seccion-titulo {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #999;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .fila {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .fila label {
      font-size: 0.9rem;
      font-weight: 500;
      min-width: 70px;
      color: #444;
    }
    .fila .valor {
      font-weight: 600;
      color: var(--fucsia);
      font-size: 1rem;
    }
    .fila .valor.mes {
      color: var(--violeta);
    }
    select, input[type="text"], input[type="number"], input[type="date"] {
      font-family: var(--fuente);
      padding: 8px 12px;
      border: 2px solid #e0ddd8;
      border-radius: 12px;
      font-size: 0.9rem;
      background: white;
      flex: 1;
      min-width: 120px;
      transition: border 0.2s;
    }
    select:focus, input:focus {
      border-color: var(--fucsia);
      outline: none;
    }
    .radio-group {
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 400;
      font-size: 0.9rem;
      min-width: auto;
      cursor: pointer;
    }
    .radio-group input[type="radio"] {
      accent-color: var(--fucsia);
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .btn {
      background: var(--fucsia);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--fuente);
      width: 100%;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 14px rgba(214, 33, 127, 0.25);
    }
    .btn:hover {
      background: var(--violeta);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(123, 47, 190, 0.3);
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-secundario {
      background: var(--gris);
      color: var(--texto);
      box-shadow: none;
      border: 2px solid #ddd;
      margin-top: 6px;
    }
    .btn-secundario:hover {
      background: #e8e5e0;
      box-shadow: none;
      transform: none;
    }
    .btn-pequeno {
      padding: 6px 14px;
      width: auto;
      font-size: 0.8rem;
      border-radius: 30px;
      background: var(--salmon-claro);
      color: var(--texto);
      box-shadow: none;
      font-weight: 600;
    }
    .btn-pequeno:hover {
      background: var(--salmon);
      color: white;
    }
    .oculto {
      display: none !important;
    }
    .mensaje {
      background: #e6f7e6;
      color: #1a7a1a;
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 500;
      text-align: center;
      margin-top: 10px;
      border-left: 4px solid #2e9e2e;
    }
    .mensaje-error {
      background: #fee;
      color: #b33;
      border-left-color: #d44;
    }
    .firma-area {
      border: 2px dashed #ccc;
      border-radius: 14px;
      padding: 10px;
      background: white;
      touch-action: none;
      position: relative;
      min-height: 140px;
    }
    .firma-area canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 320 / 140;
      border-radius: 10px;
      background: white;
      touch-action: none;
      cursor: crosshair;
    }
    .firma-acciones {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .firma-acciones .btn-pequeno {
      flex: 1;
      text-align: center;
    }
    .tag {
      display: inline-block;
      background: var(--violeta-claro);
      color: var(--violeta);
      padding: 2px 12px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .libros-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .libros-grid .tag {
      cursor: pointer;
      transition: 0.15s;
    }
    .libros-grid .tag:hover {
      background: var(--fucsia);
      color: white;
    }
    .libros-grid .tag.seleccionado {
      background: var(--fucsia);
      color: white;
    }
    .footer {
      text-align: center;
      font-size: 0.7rem;
      color: #bbb;
      margin-top: 20px;
      letter-spacing: 0.5px;
    }
    .footer a {
      color: var(--fucsia);
      text-decoration: none;
    }
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .flex-end {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .gap-8 { gap: 8px; }
    .mt-8 { margin-top: 8px; }
    .mb-8 { margin-bottom: 8px; }
    .w-full { width: 100%; }
    .text-center { text-align: center; }
    .text-muted { color: #999; font-size: 0.85rem; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 420px) {
      .app { padding: 14px 12px 20px; }
      .mes-btn { font-size: 0.6rem; padding: 4px 8px; min-width: 34px; }
      .fila { flex-direction: column; align-items: stretch; }
      .fila label { min-width: auto; }
      .radio-group { justify-content: center; }
    }
  </style>
</head>
<body>
<div class="app" id="app">

  <h1>✧ Concurso R. F. 2026</h1>
  <div class="subtitulo">Planilla mensual · <span id="mesActualDisplay">AGOSTO</span></div>

  <!-- ===== SOLAPA DE MESES ===== -->
  <div class="meses-solapa" id="mesesSolapa"></div>

  <!-- ===== CONSIGNA DEL MES ===== -->
  <div class="seccion">
    <div class="seccion-titulo">📖 Consigna del mes</div>
    <div class="fila">
      <label>Lectura</label>
      <span class="valor" id="consignaLectura">—</span>
    </div>
    <div class="fila">
      <label>Versículos</label>
      <span class="valor" id="consignaVersiculos">—</span>
    </div>
    <div class="fila">
      <label>Índice</label>
      <span class="valor" id="consignaIndice">—</span>
    </div>
  </div>

  <!-- ===== PRESENCIA ===== -->
  <div class="seccion">
    <div class="seccion-titulo">👤 Presencia</div>
    <div class="fila">
      <label>Nombre</label>
      <select id="nombreSelect"><option value="">Elegir participante…</option></select>
      <button class="btn-pequeno" id="btnAgregarNombre">Agregar</button>
    </div>
    <div class="fila mt-8">
      <label>Fecha</label>
      <input type="date" id="fechaInput">
    </div>
    <div class="fila">
      <label>Asistencia</label>
      <div class="radio-group">
        <label><input type="radio" name="asistencia" value="SI" checked> Sí</label>
        <label><input type="radio" name="asistencia" value="NO"> No</label>
      </div>
    </div>
    <div class="fila">
      <label>Puntualidad</label>
      <div class="radio-group">
        <label><input type="radio" name="puntualidad" value="SI" checked> Sí</label>
        <label><input type="radio" name="puntualidad" value="NO"> No</label>
      </div>
    </div>
  </div>

  <!-- ===== ESTUDIO ===== -->
  <div class="seccion">
    <div class="seccion-titulo">📚 Estudio</div>
    <div class="fila">
      <label>Lectura</label>
      <input type="number" id="lecturaInput" min="0" max="35" value="0" style="max-width:80px;">
      <span class="text-muted">capítulos</span>
    </div>
    <div class="fila">
      <label>Versículos</label>
      <input type="number" id="versosInput" min="0" max="50" value="0" style="max-width:80px;">
      <span class="text-muted">memorizados</span>
    </div>
    <div class="fila">
      <label>Índice</label>
      <input type="number" id="indiceInput" min="0" value="0" style="max-width:80px;">
      <span class="text-muted">libros</span>
    </div>
    <div class="fila">
      <label>Desde</label>
      <input type="text" id="indiceDesde" placeholder="Génesis" style="flex:1;">
    </div>
    <div class="fila">
      <label>Hasta</label>
      <input type="text" id="indiceHasta" placeholder="Apocalipsis" style="flex:1;">
    </div>
    <div class="fila">
      <span class="tag" id="librosCount">0 libros</span>
    </div>
  </div>

  <!-- ===== SERVICIO Y LECTURA ===== -->
  <div class="seccion">
    <div class="seccion-titulo">📬 Servicio y lectura</div>
    <div class="fila">
      <label>Folletos</label>
      <input type="number" id="folletosInput" min="0" max="99" value="0" style="max-width:80px;">
    </div>
    <div class="fila">
      <label>Invitada</label>
      <div class="radio-group">
        <label><input type="radio" name="invitada" value="SI"> Sí</label>
        <label><input type="radio" name="invitada" value="NO" checked> No</label>
      </div>
    </div>
    <div class="fila">
      <label>Libro 2026</label>
      <select id="libroSelect" style="flex:2;">
        <option value="">Seleccionar…</option>
      </select>
    </div>
    <div class="fila">
      <label>Estado</label>
      <div class="radio-group">
        <label><input type="radio" name="estadoLibro" value="LEYENDO"> Leyendo</label>
        <label><input type="radio" name="estadoLibro" value="COMPLETO"> Completo</label>
        <label><input type="radio" name="estadoLibro" value="NO" checked> No</label>
      </div>
    </div>
  </div>

  <!-- ===== FIRMA ===== -->
  <div class="seccion">
    <div class="seccion-titulo">✍️ Firma de la compañera</div>
    <div class="firma-area">
      <canvas id="firmaCanvas" width="320" height="140"></canvas>
    </div>
    <div class="firma-acciones">
      <button class="btn-pequeno" id="btnBorrarFirma">🗑 Borrar firma</button>
    </div>
    <div class="fila mt-8">
      <label>Apellido y nombre</label>
      <input type="text" id="firmanteInput" placeholder="Nombre de quien firma">
    </div>
  </div>

  <!-- ===== ACCIONES ===== -->
  <button class="btn" id="btnGuardar">💾 Guardar en la planilla</button>
  <div id="mensajeGuardado" class="mensaje oculto">✅ ¡Guardado correctamente!</div>
  <div id="mensajeError" class="mensaje mensaje-error oculto"></div>

  <div class="flex-between mt-8">
    <button class="btn-pequeno btn-secundario" id="btnReintentar">🔄 Reintentar envío</button>
    <button class="btn-pequeno btn-secundario" id="btnDescargar">⬇ Descargar copia</button>
  </div>

  <div class="footer">
    Rama Femenina · 2026
  </div>
</div>

<script>
  // ================================================================
  // CONFIGURACIÓN
  // ================================================================
  const CONFIG = {
    // ►►► PEGAR ACÁ la URL que termina en /exec que da Apps Script
    URL_APPS_SCRIPT: "https://script.google.com/macros/s/AKfycbyv1eVIvcQdYHD-R15MJMhixJj9bMF-Jrv9SKOWW-0ctGNlkxUrG5JO78YSq-UGRgBRvQ/exec",
    MAX_LECTURA: 35,
    MAX_VERSICULOS: 50,
    MAX_FOLLETOS: 99,
    LIBROS_RECOMENDADOS: [
      "MUJERES PIADOSAS",
      "MUJERES FIELES Y SU DIOS EXTRAORDINARIO",
      "7 BIOGRAFIAS",
    ],
    NOMBRES_BASE: [
      "ANA",
      "MARÍA",
      "JOSEFA",
      "ROSA",
      "ELENA",
      "CLAUDIA",
      "PATRICIA",
      "VERÓNICA"
    ]
  };

  // ================================================================
  // MESES Y CONSIGNAS
  // ================================================================
  const MESES = [
    "ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO",
    "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"
  ];

  // Versículos por mes (los mismos que en Apps Script)
  const VERSICULOS_MES = {
    ABRIL: "SANTIAGO 1:12-18",
    MAYO: "SALMOS 40:1-5",
    JUNIO: "NUMEROS 6:24-26",
    JULIO: "1 CO. 6:9-11; EFESIOS 4:17-24",
    AGOSTO: "OSEAS 11:1-8",
    SEPTIEMBRE: "SALMOS 16:5-6",
    OCTUBRE: "JUAN 4:13-14"
  };

  // Consignas de lectura por mes (se pueden personalizar)
  const CONSIGNA_LECTURA = {
    ENERO: "Génesis 1-10",
    FEBRERO: "Éxodo 1-15",
    MARZO: "Levítico 1-10",
    ABRIL: "Números 1-10",
    MAYO: "Deuteronomio 1-10",
    JUNIO: "Josué 1-10",
    JULIO: "Jueces 1-10",
    AGOSTO: "Rut, 1 Samuel 1-10",
    SEPTIEMBRE: "2 Samuel 1-10",
    OCTUBRE: "1 Reyes 1-10",
    NOVIEMBRE: "2 Reyes 1-10",
    DICIEMBRE: "Crónicas 1-10"
  };

  const CONSIGNA_INDICE = {
    ENERO: "Génesis — Éxodo",
    FEBRERO: "Levítico — Números",
    MARZO: "Deuteronomio — Josué",
    ABRIL: "Jueces — Rut",
    MAYO: "1 Samuel — 2 Samuel",
    JUNIO: "1 Reyes — 2 Reyes",
    JULIO: "Crónicas — Esdras",
    AGOSTO: "Nehemías — Ester",
    SEPTIEMBRE: "Job — Salmos",
    OCTUBRE: "Proverbios — Eclesiastés",
    NOVIEMBRE: "Cantares — Isaías",
    DICIEMBRE: "Jeremías — Lamentaciones"
  };

  // ================================================================
  // ESTADO
  // ================================================================
  let mesSeleccionado = "";
  let nombresCache = [];
  let libroSeleccionado = "";

  // ================================================================
  // DOM REFS
  // ================================================================
  const $ = id => document.getElementById(id);
  const mesSolapa = $('mesesSolapa');
  const mesActualDisplay = $('mesActualDisplay');
  const consignaLectura = $('consignaLectura');
  const consignaVersiculos = $('consignaVersiculos');
  const consignaIndice = $('consignaIndice');
  const nombreSelect = $('nombreSelect');
  const btnAgregarNombre = $('btnAgregarNombre');
  const fechaInput = $('fechaInput');
  const lecturaInput = $('lecturaInput');
  const versosInput = $('versosInput');
  const indiceInput = $('indiceInput');
  const indiceDesde = $('indiceDesde');
  const indiceHasta = $('indiceHasta');
  const librosCount = $('librosCount');
  const folletosInput = $('folletosInput');
  const libroSelect = $('libroSelect');
  const firmanteInput = $('firmanteInput');
  const btnGuardar = $('btnGuardar');
  const mensajeGuardado = $('mensajeGuardado');
  const mensajeError = $('mensajeError');
  const btnReintentar = $('btnReintentar');
  const btnDescargar = $('btnDescargar');
  const btnBorrarFirma = $('btnBorrarFirma');
  const firmaCanvas = $('firmaCanvas');

  // ================================================================
  // FIRMA (canvas)
  // ================================================================
  let dibujando = false;
  let firmaData = null;
  const ctx = firmaCanvas.getContext('2d');

  function iniciarFirma() {
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, firmaCanvas.width, firmaCanvas.height);
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#1E1E2A';
    firmaData = null;
  }

  function getPos(e) {
    const rect = firmaCanvas.getBoundingClientRect();
    const scaleX = firmaCanvas.width / rect.width;
    const scaleY = firmaCanvas.height / rect.height;
    let clientX, clientY;
    if (e.touches) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
      e.preventDefault();
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }

  function empezarDibujo(e) {
    dibujando = true;
    const p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  }

  function dibujar(e) {
    if (!dibujando) return;
    const p = getPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }

  function terminarDibujo(e) {
    if (dibujando) {
      dibujando = false;
      firmaData = firmaCanvas.toDataURL('image/png');
    }
  }

  firmaCanvas.addEventListener('mousedown', empezarDibujo);
  firmaCanvas.addEventListener('mousemove', dibujar);
  firmaCanvas.addEventListener('mouseup', terminarDibujo);
  firmaCanvas.addEventListener('mouseleave', terminarDibujo);
  firmaCanvas.addEventListener('touchstart', empezarDibujo);
  firmaCanvas.addEventListener('touchmove', dibujar);
  firmaCanvas.addEventListener('touchend', terminarDibujo);

  btnBorrarFirma.addEventListener('click', () => {
    iniciarFirma();
    firmaData = null;
  });

  iniciarFirma();

  // ================================================================
  // MESES: construir solapa
  // ================================================================
  function obtenerMesActual() {
    const ahora = new Date();
    const idx = ahora.getMonth(); // 0=enero
    return MESES[idx];
  }

  function construirSolapa() {
    const actual = obtenerMesActual();
    mesSolapa.innerHTML = '';
    MESES.forEach((mes, i) => {
      const btn = document.createElement('button');
      btn.className = 'mes-btn' + (mes === actual ? ' activo' : '');
      btn.textContent = mes.slice(0, 3);
      btn.dataset.mes = mes;
      btn.dataset.index = i;
      btn.addEventListener('click', () => seleccionarMes(mes));
      mesSolapa.appendChild(btn);
    });
    seleccionarMes(actual);
  }

  function seleccionarMes(mes) {
    mesSeleccionado = mes;
    // Actualizar botones
    document.querySelectorAll('.mes-btn').forEach(b => {
      b.classList.toggle('activo', b.dataset.mes === mes);
    });
    // Mostrar mes en el subtítulo
    mesActualDisplay.textContent = mes;
    // Actualizar consignas
    actualizarConsignas(mes);
    // Actualizar versículo en el campo correspondiente
    actualizarVersiculo(mes);
    // Cargar nombres para este mes (opcional, se refresca al guardar)
  }

  function actualizarConsignas(mes) {
    consignaLectura.textContent = CONSIGNA_LECTURA[mes] || '—';
    consignaIndice.textContent = CONSIGNA_INDICE[mes] || '—';
    // El versículo se actualiza en actualizarVersiculo
  }

  function actualizarVersiculo(mes) {
    const v = VERSICULOS_MES[mes] || '';
    consignaVersiculos.textContent = v || '—';
  }

  // ================================================================
  // CARGAR NOMBRES DESDE APPS SCRIPT
  // ================================================================
  async function cargarNombres() {
    if (!CONFIG.URL_APPS_SCRIPT) {
      // Modo desarrollo: usar nombres base
      nombresCache = CONFIG.NOMBRES_BASE.slice();
      actualizarSelectNombres();
      return;
    }
    try {
      const url = CONFIG.URL_APPS_SCRIPT + '?accion=nombres';
      const resp = await fetch(url);
      const data = await resp.json();
      if (data.ok && data.nombres) {
        nombresCache = data.nombres;
      } else {
        nombresCache = CONFIG.NOMBRES_BASE.slice();
      }
    } catch (e) {
      console.warn('Error cargando nombres, usando base', e);
      nombresCache = CONFIG.NOMBRES_BASE.slice();
    }
    actualizarSelectNombres();
  }

  function actualizarSelectNombres() {
    const actual = nombreSelect.value;
    nombreSelect.innerHTML = '<option value="">Elegir participante…</option>';
    nombresCache.forEach(n => {
      const opt = document.createElement('option');
      opt.value = n;
      opt.textContent = n;
      nombreSelect.appendChild(opt);
    });
    if (nombresCache.includes(actual)) nombreSelect.value = actual;
  }

  // ================================================================
  // LIBROS RECOMENDADOS
  // ================================================================
  function cargarLibros() {
    libroSelect.innerHTML = '<option value="">Seleccionar…</option>';
    CONFIG.LIBROS_RECOMENDADOS.forEach(l => {
      const opt = document.createElement('option');
      opt.value = l;
      opt.textContent = l;
      libroSelect.appendChild(opt);
    });
  }

  // ================================================================
  // CONTADOR DE LIBROS (índice)
  // ================================================================
  function actualizarContadorLibros() {
    const desde = indiceDesde.value.trim();
    const hasta = indiceHasta.value.trim();
    if (desde && hasta) {
      librosCount.textContent = `📖 ${desde} → ${hasta}`;
    } else {
      librosCount.textContent = '0 libros';
    }
  }

  indiceDesde.addEventListener('input', actualizarContadorLibros);
  indiceHasta.addEventListener('input', actualizarContadorLibros);

  // ================================================================
  // AGREGAR NOMBRE (local)
  // ================================================================
  btnAgregarNombre.addEventListener('click', () => {
    const nuevo = prompt('Ingresá el nombre de la participante:');
    if (nuevo && nuevo.trim()) {
      const nom = nuevo.trim().toUpperCase();
      if (!nombresCache.includes(nom)) {
        nombresCache.push(nom);
        nombresCache.sort();
        actualizarSelectNombres();
        nombreSelect.value = nom;
      } else {
        alert('Ese nombre ya existe en la lista.');
      }
    }
  });

  // ================================================================
  // GUARDAR
  // ================================================================
  btnGuardar.addEventListener('click', guardarRegistro);

  async function guardarRegistro() {
    ocultarMensajes();

    // Validaciones básicas
    const nombre = nombreSelect.value;
    if (!nombre) {
      mostrarError('Por favor, seleccioná o agregá un nombre.');
      return;
    }

    const fecha = fechaInput.value;
    if (!fecha) {
      mostrarError('Por favor, seleccioná una fecha.');
      return;
    }

    const asistencia = document.querySelector('input[name="asistencia"]:checked')?.value || 'SI';
    const puntualidad = document.querySelector('input[name="puntualidad"]:checked')?.value || 'SI';
    const lectura = parseInt(lecturaInput.value) || 0;
    const versos = parseInt(versosInput.value) || 0;
    const indice = parseInt(indiceInput.value) || 0;
    const indiceDesdeVal = indiceDesde.value.trim();
    const indiceHastaVal = indiceHasta.value.trim();
    const folletos = parseInt(folletosInput.value) || 0;
    const invitada = document.querySelector('input[name="invitada"]:checked')?.value || 'NO';
    const libro = libroSelect.value || '';
    const estadoLibro = document.querySelector('input[name="estadoLibro"]:checked')?.value || 'NO';
    const firmante = firmanteInput.value.trim() || '';

    // Validar límites
    if (lectura > CONFIG.MAX_LECTURA) {
      mostrarError(`La lectura no puede superar ${CONFIG.MAX_LECTURA} capítulos.`);
      return;
    }
    if (versos > CONFIG.MAX_VERSICULOS) {
      mostrarError(`Los versículos no pueden superar ${CONFIG.MAX_VERSICULOS}.`);
      return;
    }
    if (folletos > CONFIG.MAX_FOLLETOS) {
      mostrarError(`Los folletos no pueden superar ${CONFIG.MAX_FOLLETOS}.`);
      return;
    }

    // Preparar datos
    const payload = {
      nombre: nombre,
      fecha: fecha,
      mesHoja: mesSeleccionado,
      mesConsigna: mesSeleccionado,
      asistencia: asistencia,
      puntualidad: puntualidad,
      lectura: lectura,
      versos: versos,
      indice: indice,
      indiceDesde: indiceDesdeVal,
      indiceHasta: indiceHastaVal,
      folletos: folletos,
      invitada: invitada,
      libro: libro,
      estadoLibro: estadoLibro,
      firmante: firmante,
      firma: firmaData || ''
    };

    // Si no hay URL configurada, simular éxito (modo desarrollo)
    if (!CONFIG.URL_APPS_SCRIPT) {
      console.log('Modo desarrollo: registro simulado', payload);
      mostrarExito('Registro simulado (sin conexión a Apps Script)');
      return;
    }

    try {
      const resp = await fetch(CONFIG.URL_APPS_SCRIPT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      // Con no-cors no podemos leer la respuesta, pero el servidor igual procesa
      // Mostramos éxito asumiendo que funcionó
      mostrarExito('✅ ¡Guardado correctamente!');
      // Recargar nombres para actualizar la lista
      await cargarNombres();
      // Limpiar firma
      iniciarFirma();
      firmaData = null;
    } catch (e) {
      console.error('Error al guardar:', e);
      mostrarError('Hubo un error al guardar. Revisá la conexión y la URL de Apps Script.');
    }
  }

  // ================================================================
  // MENSAJES
  // ================================================================
  function ocultarMensajes() {
    mensajeGuardado.classList.add('oculto');
    mensajeError.classList.add('oculto');
  }

  function mostrarExito(texto) {
    mensajeGuardado.textContent = texto || '✅ ¡Guardado correctamente!';
    mensajeGuardado.classList.remove('oculto');
    mensajeError.classList.add('oculto');
    setTimeout(() => mensajeGuardado.classList.add('oculto'), 5000);
  }

  function mostrarError(texto) {
    mensajeError.textContent = texto || 'Ocurrió un error.';
    mensajeError.classList.remove('oculto');
    mensajeGuardado.classList.add('oculto');
  }

  // ================================================================
  // REINTENTAR / DESCARGAR
  // ================================================================
  btnReintentar.addEventListener('click', () => {
    ocultarMensajes();
    // Recargar nombres
    cargarNombres();
  });

  btnDescargar.addEventListener('click', () => {
    // Descargar una copia del formulario (como JSON)
    const datos = {
      mes: mesSeleccionado,
      fecha: fechaInput.value,
      nombre: nombreSelect.value,
      asistencia: document.querySelector('input[name="asistencia"]:checked')?.value,
      puntualidad: document.querySelector('input[name="puntualidad"]:checked')?.value,
      lectura: lecturaInput.value,
      versos: versosInput.value,
      indice: indiceInput.value,
      indiceDesde: indiceDesde.value,
      indiceHasta: indiceHasta.value,
      folletos: folletosInput.value,
      invitada: document.querySelector('input[name="invitada"]:checked')?.value,
      libro: libroSelect.value,
      estadoLibro: document.querySelector('input[name="estadoLibro"]:checked')?.value,
      firmante: firmanteInput.value,
      tieneFirma: !!firmaData
    };
    const blob = new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `papelito_${mesSeleccionado}_${fechaInput.value || 'sin-fecha'}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  // ================================================================
  // INICIALIZAR
  // ================================================================
  function init() {
    // Fecha por defecto: hoy
    const hoy = new Date();
    fechaInput.value = hoy.toISOString().split('T')[0];

    // Construir solapa de meses
    construirSolapa();

    // Cargar libros
    cargarLibros();

    // Cargar nombres
    cargarNombres();

    // Actualizar contador de libros
    actualizarContadorLibros();

    // Evento para actualizar contador al cambiar
    indiceDesde.addEventListener('input', actualizarContadorLibros);
    indiceHasta.addEventListener('input', actualizarContadorLibros);

    console.log('📋 Papelito inicializado. Mes actual:', mesSeleccionado);
  }

  init();
</script>
</body>
</html>
